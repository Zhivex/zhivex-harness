version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  # Desktop is paused. Keep the directory entry so the pause is explicit,
  # and open no dependency update pull requests for it.
  - package-ecosystem: bun
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
