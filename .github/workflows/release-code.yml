name: Publish Code npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated code-v0.x.y or code-v0.x.y-rc.N tag on main with passing CI and CodeQL
        required: true
        type: string
      channel:
        description: Stable uses latest; RC uses next (validated against the manifest)
        required: true
        default: next
        type: choice
        options: [latest, next]
      mode:
        description: Bootstrap retains the validated artifact for the first authenticated publication
        required: true
        default: bootstrap
        type: choice
        options: [bootstrap, oidc]
      confirm_publication:
        description: Confirm public immutable publication (required for OIDC mode)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: code-npm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  resolve-release-commit:
    name: Resolve annotated tag on main
    if: ${{ github.repository == 'Zhivex/zhivex-harness' }}
    permissions: {}
    uses: ./.github/workflows/resolve-protected-release-ref.yml
    with:
      tag: ${{ inputs.tag }}
      kind: code

  validate:
    name: Validate exact Code release artifact
    needs: resolve-release-commit
    if: ${{ github.repository == 'Zhivex/zhivex-harness' && needs.resolve-release-commit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require trusted release commit
        env:
          RELEASE_SHA: ${{ needs.resolve-release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'trusted release commit %s\n' "$RELEASE_SHA"
      - name: Checkout resolved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-commit.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify annotated tag and exact main push CI, CodeQL, installed and web journeys
        run: bun run scripts/code-release.ts identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install immutable build tools and test source
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          bun run packages/code/scripts/link-local-engine.ts
          bun install --cwd packages/web --frozen-lockfile --ignore-scripts
          bun run build:code
          bun run typecheck:code
          bun run test:code
          bun test tests/code-release.test.ts tests/code-bootstrap-provenance.test.ts
      - name: Pack one immutable Code artifact and fetch published engine
        run: |
          mkdir -p release-code-artifacts
          bun run scripts/code-release.ts engine release-code-artifacts/harness.tgz
          (cd packages/code && bun pm pack --ignore-scripts --filename "$GITHUB_WORKSPACE/release-code-artifacts/code.tgz")
          bun run scripts/code-release.ts inspect release-code-artifacts/code.tgz
      - name: Test actual registry resolution without engine overrides
        run: bun run scripts/code-release.ts smoke-registry release-code-artifacts/code.tgz
      - name: Test the retained Code artifact with offline installed PTY journeys
        run: node packages/code/scripts/installed-journey.mjs release-code-artifacts/code.tgz
        env:
          CODE_JOURNEY_OUTPUT: ${{ github.workspace }}/release-code-artifacts
      - name: Test the retained Code web artifact with the published engine
        run: |
          node packages/web/scripts/installed-smoke.mjs
          cp packages/web/.test-output/installed-report.json release-code-artifacts/installed-web-report.json
        env:
          CODE_WEB_ARTIFACT: ${{ github.workspace }}/release-code-artifacts/code.tgz
      - name: Test installed products across package managers
        run: |
          npm install --prefix "$RUNNER_TEMP/code-package-managers" --ignore-scripts --no-audit --no-fund pnpm@11.25.0 yarn@1.22.22
          node scripts/smoke-engine-code.mjs release-code-artifacts/harness.tgz release-code-artifacts/code.tgz > release-code-artifacts/acceptance.json
        env:
          SMOKE_PNPM_PATH: ${{ runner.temp }}/code-package-managers/node_modules/.bin/pnpm
          SMOKE_YARN_PATH: ${{ runner.temp }}/code-package-managers/node_modules/.bin/yarn
      - name: Generate npm provenance bound to this artifact and tagged source
        run: |
          npm install --prefix "$RUNNER_TEMP/code-provenance-tools" --ignore-scripts --no-audit --no-fund npm@11.6.1
          node scripts/code-bootstrap-provenance.cjs generate release-code-artifacts/code.tgz release-code-artifacts/code.sigstore.json
        env:
          CODE_PROVENANCE_NPM_ROOT: ${{ runner.temp }}/code-provenance-tools/node_modules/npm
      - name: Retain immutable artifact, provenance and installed acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-release-${{ github.sha }}
          path: |
            release-code-artifacts/code.tgz
            release-code-artifacts/code.sigstore.json
            release-code-artifacts/SHA512SUMS
            release-code-artifacts/acceptance.json
            release-code-artifacts/installed-web-report.json
            release-code-artifacts/installed-journey-report.json
            release-code-artifacts/installed-journey-transcript.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Record publication boundary
        env:
          MODE: ${{ inputs.mode }}
        run: |
          printf 'Code artifact validated for %s at %s. Mode: %s. Bootstrap does not publish; download the retained tarball and provenance bundle for authenticated first publication.\n' "$RELEASE_TAG" "$GITHUB_SHA" "$MODE" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish retained Code artifact with OIDC
    needs:
      - resolve-release-commit
      - validate
    if: ${{ inputs.mode == 'oidc' && inputs.confirm_publication && needs.resolve-release-commit.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require trusted release commit
        env:
          RELEASE_SHA: ${{ needs.resolve-release-commit.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'trusted release commit %s\n' "$RELEASE_SHA"
      - name: Checkout resolved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-commit.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Revalidate release identity after protected approval
        run: bun run scripts/code-release.ts identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: code-release-${{ github.sha }}
          path: release-code-artifacts
      - name: Verify transferred artifact and compatible npm client
        run: |
          (cd release-code-artifacts && shasum -a 512 -c SHA512SUMS)
          bun run scripts/code-release.ts inspect release-code-artifacts/code.tgz
          npm install --prefix "$RUNNER_TEMP/code-npm-client" --ignore-scripts --no-audit --no-fund npm@11.6.1
      - name: Check immutable registry state
        id: registry
        run: |
          STATUS="$(bun run scripts/code-release.ts status release-code-artifacts/code.tgz)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Publish exact bytes with npm Trusted Publishing
        if: steps.registry.outputs.status == 'absent'
        run: node "$RUNNER_TEMP/code-npm-client/node_modules/npm/bin/npm-cli.js" publish ./release-code-artifacts/code.tgz --ignore-scripts --access public --provenance --tag "$RELEASE_CHANNEL"
      - name: Verify registry bytes, distribution tag and provenance
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bun run scripts/code-release.ts verify release-code-artifacts/code.tgz; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
