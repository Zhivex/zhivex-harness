name: Code installed journeys

on:
  pull_request:
    paths:
      - "packages/code/**"
      - ".github/workflows/code-journey.yml"
  push:
    branches: [main]
    paths:
      - "packages/code/**"
      - ".github/workflows/code-journey.yml"

permissions:
  contents: read

jobs:
  journey:
    name: Installed Code PTY / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install Code with its published engine dependency
        run: bun install --cwd packages/code --ignore-scripts
      - name: Types, regression tests and independent build
        working-directory: packages/code
        run: |
          bun run typecheck
          bun run test
      - name: npm tarball install and offline terminal journeys
        working-directory: packages/code
        run: node scripts/installed-journey.mjs
        env:
          CODE_JOURNEY_OUTPUT: ${{ runner.temp }}/code-journey
      - name: Retain report and terminal transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-journey-${{ matrix.node }}-${{ matrix.os }}
          path: ${{ runner.temp }}/code-journey/*
          if-no-files-found: warn
