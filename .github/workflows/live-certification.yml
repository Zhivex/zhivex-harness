name: Live provider certification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated vX.Y.Z or vX.Y.Z-rc.N tag; must match package.json and resolve to main
        required: true
        type: string
      providers:
        description: Providers for per-provider gates; mixed routing always covers all six routes
        required: true
        default: meta,qwen,openai,anthropic,gemini,vertex
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-provider-certification-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: live-certification

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ZHIVEX_HARNESS_LIVE: "1"
      ZHIVEX_HARNESS_LIVE_META_MODEL: muse-spark-1.3-contributor
      ZHIVEX_HARNESS_LIVE_QWEN_MODEL: qwen3.8-flash
      ZHIVEX_HARNESS_LIVE_OPENAI_MODEL: gpt-6-luna
      ZHIVEX_HARNESS_LIVE_PROVIDERS: ${{ inputs.providers }}
      ZHIVEX_HARNESS_LIVE_ANTHROPIC_MODEL: claude-sonnet-5-5
      ZHIVEX_HARNESS_LIVE_GEMINI_MODEL: gemini-3.6-flash
      ZHIVEX_HARNESS_LIVE_VERTEX_MODEL: gemini-3.7-flash
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
      VERTEX_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.VERTEX_WORKLOAD_IDENTITY_PROVIDER }}
      VERTEX_SERVICE_ACCOUNT: ${{ vars.VERTEX_SERVICE_ACCOUNT }}
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify exact annotated release target
        run: bun run scripts/check-release-readiness.ts --tag "$RELEASE_TAG"

      - name: Bind immutable live diagnostic identity
        run: |
          mkdir -p release-artifacts/live-diagnostics
          ARTIFACT="release-artifacts/zhivex-ai-harness-${RELEASE_TAG#v}.tgz"
          bun run build
          bun pm pack --filename "$ARTIFACT" --ignore-scripts
          bun run artifact:check -- "$ARTIFACT"
          ARTIFACT_SHA512="$(bun -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);' "$ARTIFACT")"
          echo "ARTIFACT_SHA512=$ARTIFACT_SHA512" >> "$GITHUB_ENV"
          LIVE_RUNTIME_ROOT="$GITHUB_WORKSPACE/release-artifacts/live-runtime"
          mkdir -p "$LIVE_RUNTIME_ROOT"
          tar -xzf "$ARTIFACT" -C "$LIVE_RUNTIME_ROOT"
          echo "ZHIVEX_HARNESS_LIVE_RUNTIME=$LIVE_RUNTIME_ROOT/package/dist/index.js" >> "$GITHUB_ENV"
          echo "ZHIVEX_HARNESS_LIVE_REQUIRE_ARTIFACT=1" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate protected provider configuration
        id: live_config
        run: bun run scripts/check-live-release-config.ts
        env:
          # Mixed routing requires the complete route configuration even for a diagnostic subset.
          ZHIVEX_HARNESS_LIVE_PROVIDERS: meta,qwen,openai,anthropic,gemini,vertex
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Authenticate Vertex using workload identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.VERTEX_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.VERTEX_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Preload enforced execution image
        id: live_oci_preload
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate oci-preload
          --out release-artifacts/live-diagnostics/oci-preload.json
          -- docker pull node:24-bookworm-slim

      - name: Certify deterministic OCI boundary
        id: live_oci
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate oci
          --out release-artifacts/live-diagnostics/oci.json
          -- bun run smoke:oci
        env:
          ZHIVEX_HARNESS_OCI_REQUIRED: "1"

      - name: Certify base provider behavior
        id: live_base
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate base
          --out release-artifacts/live-diagnostics/base.json
          -- bun run smoke:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify approval continuity after compaction
        id: live_compaction
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate compaction
          --out release-artifacts/live-diagnostics/compaction.json
          -- bun run smoke:live
        env:
          ZHIVEX_HARNESS_LIVE_APPROVAL_COMPACTION: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify bounded reviewer orchestration
        id: live_orchestration
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate orchestration
          --out release-artifacts/live-diagnostics/orchestration.json
          -- bun run smoke:live:orchestration
        env:
          ZHIVEX_HARNESS_LIVE_STRUCTURED_DELEGATION: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify mixed-provider routing openai to vertex
        id: live_routing_vertex
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate routing-vertex
          --out release-artifacts/live-diagnostics/routing-vertex.json
          -- bun run smoke:live:routing
        env:
          ZHIVEX_HARNESS_LIVE_PARENT_PROVIDER: openai
          ZHIVEX_HARNESS_LIVE_REVIEWER_PROVIDER: vertex
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify mixed-provider routing openai to anthropic
        id: live_routing_anthropic
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate routing-anthropic
          --out release-artifacts/live-diagnostics/routing-anthropic.json
          -- bun run smoke:live:routing
        env:
          ZHIVEX_HARNESS_LIVE_PARENT_PROVIDER: openai
          ZHIVEX_HARNESS_LIVE_REVIEWER_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify mixed-provider routing openai to gemini
        id: live_routing_gemini
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate routing-gemini
          --out release-artifacts/live-diagnostics/routing-gemini.json
          -- bun run smoke:live:routing
        env:
          ZHIVEX_HARNESS_LIVE_PARENT_PROVIDER: openai
          ZHIVEX_HARNESS_LIVE_REVIEWER_PROVIDER: gemini
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify mixed-provider routing qwen to meta
        id: live_routing_meta
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate routing-meta
          --out release-artifacts/live-diagnostics/routing-meta.json
          -- bun run smoke:live:routing
        env:
          ZHIVEX_HARNESS_LIVE_PARENT_PROVIDER: qwen
          ZHIVEX_HARNESS_LIVE_REVIEWER_PROVIDER: meta
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify model-directed execution
        id: live_execution
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate execution
          --out release-artifacts/live-diagnostics/execution.json
          -- bun run smoke:live:execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Certify multi-process conversation continuity
        id: live_continuity
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate continuity
          --out release-artifacts/live-diagnostics/continuity.json
          -- bun run scripts/live-continuity-smoke.ts release-artifacts/continuity-evidence.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}

      - name: Enforce complete live certification result
        if: ${{ always() }}
        run: >-
          bun run scripts/release-diagnostics.ts
          --title "Manual live certification"
          --diagnostics-dir release-artifacts/live-diagnostics
          --gate "oci-preload=${{ steps.live_oci_preload.outcome }}"
          --gate "oci=${{ steps.live_oci.outcome }}"
          --gate "base=${{ steps.live_base.outcome }}"
          --gate "compaction=${{ steps.live_compaction.outcome }}"
          --gate "continuity=${{ steps.live_continuity.outcome }}"
          --gate "orchestration=${{ steps.live_orchestration.outcome }}"
          --gate "routing-vertex=${{ steps.live_routing_vertex.outcome }}"
          --gate "routing-anthropic=${{ steps.live_routing_anthropic.outcome }}"
          --gate "routing-gemini=${{ steps.live_routing_gemini.outcome }}"
          --gate "routing-meta=${{ steps.live_routing_meta.outcome }}"
          --gate "execution=${{ steps.live_execution.outcome }}"

      - name: Upload sanitized live diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-artifacts/live-diagnostics/*.json
            release-artifacts/continuity-evidence.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
