name: Live provider certification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated vX.Y.Z or vX.Y.Z-rc.N tag; must match package.json and resolve to main
        required: true
        type: string
      providers:
        description: Comma-separated certified providers; keep the default for full release evidence
        required: true
        default: meta,qwen,openai
        type: string

permissions:
  contents: read

concurrency:
  group: live-provider-certification-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-certification

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ZHIVEX_HARNESS_LIVE: "1"
      ZHIVEX_HARNESS_LIVE_PROVIDERS: ${{ inputs.providers }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify exact annotated release target
        run: bun run scripts/check-release-readiness.ts --tag "$RELEASE_TAG"

      - name: Preload OCI execution image
        run: docker pull node:24-bookworm-slim

      - name: Certify enforced OCI boundaries
        run: bun run smoke:oci
        env:
          ZHIVEX_HARNESS_OCI_REQUIRED: "1"

      - name: Run fail-closed base, orchestration, and enforced-execution certification
        run: |
          bun run smoke:live
          bun run smoke:live:orchestration
          bun run smoke:live:routing
          bun run smoke:live:execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
