name: Assistant

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Assistant / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install immutable root dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and prepare the exact local engine
        run: |
          bun run prepare:assistant
          bun run packages/code/scripts/link-local-engine.ts
      - name: Install Chromium
        working-directory: packages/assistant
        run: bun x playwright install --with-deps chromium
      - name: Validate types, tests and isolated installed consumer
        run: bun run check:assistant
      - name: Exercise setup, integrations and proactive notices in the browser
        if: matrix.node == '24'
        run: bun run smoke:assistant:web
      - name: Verify checks produced no tracked changes
        run: git diff --exit-code

  tauri-native:
    name: Tauri / macOS arm64
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Verify native architecture and Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          cargo --version
      - name: Prepare exact engine and Assistant dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:assistant
      - name: Validate native PTY and lifecycle contracts
        run: cargo test --locked --manifest-path packages/assistant/src-tauri/Cargo.toml
      - name: Validate macOS release and bundle integrity contracts
        working-directory: packages/assistant
        run: |
          brew install sqlite
          bun test --preload ../../tests/preload-runtime.ts tests/release-package.test.ts tests/pilot.test.ts
      - name: Build native application with bundled Node runtime
        run: bun run --cwd packages/assistant build:desktop
      - name: Exercise the packaged runtime, authentication and restart
        run: bun run --cwd packages/assistant smoke:desktop -- "src-tauri/target/release/bundle/macos/Zhivex Assistant.app/Contents/Resources/runtime"
      - name: Verify build produced no tracked changes
        run: git diff --exit-code
