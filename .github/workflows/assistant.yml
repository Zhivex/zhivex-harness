name: Core Assistant integrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: assistant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Core Assistant integrations / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Install immutable root dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build core and run domain regressions
        run: bun run build && bun run test:assistant
      - name: Verify checks produced no tracked changes
        run: git diff --exit-code
