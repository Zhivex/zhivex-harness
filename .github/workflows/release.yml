name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated vX.Y.Z or vX.Y.Z-rc.N tag; must match package.json and resolve to main
        required: true
        type: string
      channel:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      confirm_publication:
        description: I confirm this immutable public npm publication
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate exact tarball
    if: ${{ inputs.confirm_publication && github.repository == 'Zhivex/zhivex-harness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install immutable dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Preload immutable-capable OCI execution image
        run: docker pull node:24-bookworm-slim

      - name: Validate source and release state
        run: |
          bun run release:check
          bun run scripts/check-release-readiness.ts --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL" --registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZHIVEX_HARNESS_OCI_REQUIRED: "1"

      - name: Pack exact release artifact with Bun
        run: |
          mkdir -p release-artifacts
          ARTIFACT="release-artifacts/zhivex-ai-harness-${RELEASE_TAG#v}.tgz"
          bun pm pack --filename "$ARTIFACT" --ignore-scripts
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Inspect exact release artifact
        run: bun run artifact:check -- "$ARTIFACT"

      - name: Install and execute exact release artifact
        run: bun run smoke:artifact -- "$ARTIFACT"

      - name: Upload immutable validated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/SHA512SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish validated tarball
    needs:
      - validate
      - certify-live
      - representative-evaluation
    if: ${{ needs.validate.result == 'success' && needs.certify-live.result == 'success' && needs.representative-evaluation.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node for npm OIDC transport
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download immutable validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifacts

      - name: Verify transferred artifact bytes
        run: |
          ARTIFACT="release-artifacts/zhivex-ai-harness-${RELEASE_TAG#v}.tgz"
          (cd release-artifacts && shasum -a 512 -c SHA512SUMS)
          bun run artifact:check -- "$ARTIFACT"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Verify npm Trusted Publishing client
        run: >-
          node -e 'const { execFileSync } = require("node:child_process"); const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [major, minor, patch] = version.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error(`npm ${version} does not support Trusted Publishing; require >=11.5.1`); console.log(`npm ${version} supports Trusted Publishing`);'

      - name: Check immutable registry state
        id: registry
        run: |
          STATUS="$(bun run release:status -- "$ARTIFACT")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Publish exact artifact with provenance
        if: steps.registry.outputs.status == 'absent'
        run: npm publish "./$ARTIFACT" --access public --provenance --tag "$RELEASE_CHANNEL"

      - name: Verify registry integrity and provenance
        run: bun run release:verify -- "$ARTIFACT" "$RELEASE_CHANNEL"

  certify-live:
    name: Certify exact release tag with live providers
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-certification
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ZHIVEX_HARNESS_LIVE: "1"
      ZHIVEX_HARNESS_LIVE_PROVIDERS: meta,qwen,openai
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install immutable dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify exact annotated release target
        run: bun run scripts/check-release-readiness.ts --tag "$RELEASE_TAG" --channel "${{ inputs.channel }}"

      - name: Download immutable validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifacts

      - name: Bind immutable live diagnostic identity
        run: |
          ARTIFACT="release-artifacts/zhivex-ai-harness-${RELEASE_TAG#v}.tgz"
          (cd release-artifacts && shasum -a 512 -c SHA512SUMS)
          bun run artifact:check -- "$ARTIFACT"
          ARTIFACT_SHA512="$(bun -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);' "$ARTIFACT")"
          echo "ARTIFACT_SHA512=$ARTIFACT_SHA512" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p release-artifacts/live-diagnostics

      - name: Preload enforced execution image
        id: live_oci_preload
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate oci-preload
          --out release-artifacts/live-diagnostics/oci-preload.json
          -- docker pull node:24-bookworm-slim

      - name: Certify deterministic OCI boundary
        id: live_oci
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate oci
          --out release-artifacts/live-diagnostics/oci.json
          -- bun run smoke:oci
        env:
          ZHIVEX_HARNESS_OCI_REQUIRED: "1"

      - name: Certify base provider behavior
        id: live_base
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate base
          --out release-artifacts/live-diagnostics/base.json
          -- bun run smoke:live
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Certify bounded reviewer orchestration
        id: live_orchestration
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate orchestration
          --out release-artifacts/live-diagnostics/orchestration.json
          -- bun run smoke:live:orchestration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Certify mixed-provider routing
        id: live_routing
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate routing
          --out release-artifacts/live-diagnostics/routing.json
          -- bun run smoke:live:routing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Certify model-directed execution
        id: live_execution
        continue-on-error: true
        run: >-
          bun run scripts/run-release-gate.ts
          --gate execution
          --out release-artifacts/live-diagnostics/execution.json
          -- bun run smoke:live:execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Enforce complete live certification result
        if: ${{ always() }}
        run: >-
          bun run scripts/release-diagnostics.ts
          --title "Release-bound live certification"
          --diagnostics-dir release-artifacts/live-diagnostics
          --gate "oci-preload=${{ steps.live_oci_preload.outcome }}"
          --gate "oci=${{ steps.live_oci.outcome }}"
          --gate "base=${{ steps.live_base.outcome }}"
          --gate "orchestration=${{ steps.live_orchestration.outcome }}"
          --gate "routing=${{ steps.live_routing.outcome }}"
          --gate "execution=${{ steps.live_execution.outcome }}"

      - name: Upload sanitized live diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/live-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  representative-evaluation:
    name: Certify representative repository matrix
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: live-certification
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REPRESENTATIVE_DATASET: evaluations/representative-repositories.jsonl
      REPRESENTATIVE_DATASET_NAME: zhivex-representative-repositories
      REPRESENTATIVE_DATASET_REVISION: representative-repositories-v1
      REPRESENTATIVE_IMAGE: zhivex-harness/time-to-safe-fix:node24-pytest9
      WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install immutable dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download immutable validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifacts

      - name: Bind dataset, driver, artifact, source, and OCI image
        run: |
          ARTIFACT="release-artifacts/zhivex-ai-harness-${RELEASE_TAG#v}.tgz"
          (cd release-artifacts && shasum -a 512 -c SHA512SUMS)
          bun run artifact:check -- "$ARTIFACT"
          bun run benchmark:safe-fix:image:build
          ARTIFACT_SHA512="$(bun -e 'import { createHash } from "node:crypto"; const bytes = await Bun.file(process.argv[1]).arrayBuffer(); process.stdout.write(`sha512-${createHash("sha512").update(Buffer.from(bytes)).digest("base64")}`);' "$ARTIFACT")"
          RUNTIME_ROOT="$GITHUB_WORKSPACE/release-artifacts/representative-runtime"
          mkdir -p "$RUNTIME_ROOT"
          tar -xzf "$ARTIFACT" -C "$RUNTIME_ROOT"
          RUNTIME_MODULE="$RUNTIME_ROOT/package/dist/index.js"
          test -f "$RUNTIME_MODULE"
          RUNTIME_VERSION="$(bun -e 'import { pathToFileURL } from "node:url"; const runtime = await import(pathToFileURL(process.argv[1]).href); process.stdout.write(runtime.HARNESS_VERSION);' "$RUNTIME_MODULE")"
          test "$RUNTIME_VERSION" = "${RELEASE_TAG#v}"
          echo "ARTIFACT_SHA512=$ARTIFACT_SHA512" >> "$GITHUB_ENV"
          echo "ZHIVEX_SAFE_FIX_HARNESS_RUNTIME=$RUNTIME_MODULE" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DRIVER_COMMIT=$(git log -1 --format=%H -- scripts/benchmark-time-to-safe-fix.ts scripts/time-to-safe-fix-zhivex-driver.ts scripts/time-to-safe-fix-direct-profile.ts scripts/time-to-safe-fix-governed-profile.ts scripts/time-to-safe-fix-runtime.ts scripts/generate-representative-evidence.ts scripts/representative-evidence.ts evaluations/representative-repositories.jsonl docker/time-to-safe-fix.Dockerfile docker/time-to-safe-fix.requirements.txt src/time-to-safe-fix.ts)" >> "$GITHUB_ENV"
          echo "OCI_IMAGE_DIGEST=$(docker image inspect "$REPRESENTATIVE_IMAGE" --format '{{.Id}}')" >> "$GITHUB_ENV"
          mkdir -p release-artifacts/representative-rows release-artifacts/representative-raw release-artifacts/representative-diagnostics

      - name: Evaluate Meta against the complete pinned matrix
        id: representative_meta
        continue-on-error: true
        run: |
          REPORT=release-artifacts/representative-raw/meta.json
          bun run scripts/benchmark-time-to-safe-fix.ts --dataset "$REPRESENTATIVE_DATASET" --dataset-name "$REPRESENTATIVE_DATASET_NAME" --dataset-revision "$REPRESENTATIVE_DATASET_REVISION" --tasks 7 --repetitions 1 --profiles governed --carriers rule_file --seed 7 --driver-zhivex --driver-timeout-ms 300000 --out "$REPORT" --diagnostics-out release-artifacts/representative-diagnostics/meta.json --summary
          bun run scripts/generate-representative-evidence.ts --report "$REPORT" --release-tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --artifact-sha512 "$ARTIFACT_SHA512" --driver-commit "$DRIVER_COMMIT" --oci-image-digest "$OCI_IMAGE_DIGEST" --workflow-run-url "$WORKFLOW_RUN_URL" --provider meta --model muse-spark-1.2 > release-artifacts/representative-rows/meta.json
        env:
          ZHIVEX_SAFE_FIX_PROVIDER: meta
          ZHIVEX_SAFE_FIX_MODEL: muse-spark-1.2
          ZHIVEX_SAFE_FIX_OCI_IMAGE: ${{ env.REPRESENTATIVE_IMAGE }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}

      - name: Evaluate Qwen against the complete pinned matrix
        id: representative_qwen
        continue-on-error: true
        run: |
          REPORT=release-artifacts/representative-raw/qwen.json
          bun run scripts/benchmark-time-to-safe-fix.ts --dataset "$REPRESENTATIVE_DATASET" --dataset-name "$REPRESENTATIVE_DATASET_NAME" --dataset-revision "$REPRESENTATIVE_DATASET_REVISION" --tasks 7 --repetitions 1 --profiles governed --carriers rule_file --seed 7 --driver-zhivex --driver-timeout-ms 300000 --out "$REPORT" --diagnostics-out release-artifacts/representative-diagnostics/qwen.json --summary
          bun run scripts/generate-representative-evidence.ts --report "$REPORT" --release-tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --artifact-sha512 "$ARTIFACT_SHA512" --driver-commit "$DRIVER_COMMIT" --oci-image-digest "$OCI_IMAGE_DIGEST" --workflow-run-url "$WORKFLOW_RUN_URL" --provider qwen --model qwen3.8-max > release-artifacts/representative-rows/qwen.json
        env:
          ZHIVEX_SAFE_FIX_PROVIDER: qwen
          ZHIVEX_SAFE_FIX_MODEL: qwen3.8-max
          ZHIVEX_SAFE_FIX_OCI_IMAGE: ${{ env.REPRESENTATIVE_IMAGE }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}

      - name: Evaluate OpenAI against the complete pinned matrix
        id: representative_openai
        continue-on-error: true
        run: |
          REPORT=release-artifacts/representative-raw/openai.json
          bun run scripts/benchmark-time-to-safe-fix.ts --dataset "$REPRESENTATIVE_DATASET" --dataset-name "$REPRESENTATIVE_DATASET_NAME" --dataset-revision "$REPRESENTATIVE_DATASET_REVISION" --tasks 7 --repetitions 1 --profiles governed --carriers rule_file --seed 7 --driver-zhivex --driver-timeout-ms 300000 --out "$REPORT" --diagnostics-out release-artifacts/representative-diagnostics/openai.json --summary
          bun run scripts/generate-representative-evidence.ts --report "$REPORT" --release-tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT" --artifact-sha512 "$ARTIFACT_SHA512" --driver-commit "$DRIVER_COMMIT" --oci-image-digest "$OCI_IMAGE_DIGEST" --workflow-run-url "$WORKFLOW_RUN_URL" --provider openai --model gpt-5.6-luna > release-artifacts/representative-rows/openai.json
        env:
          ZHIVEX_SAFE_FIX_PROVIDER: openai
          ZHIVEX_SAFE_FIX_MODEL: gpt-5.6-luna
          ZHIVEX_SAFE_FIX_OCI_IMAGE: ${{ env.REPRESENTATIVE_IMAGE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Assemble sanitized fail-closed evidence
        id: representative_assembly
        if: ${{ steps.representative_meta.outcome == 'success' && steps.representative_qwen.outcome == 'success' && steps.representative_openai.outcome == 'success' }}
        run: >-
          bun run scripts/assemble-representative-evidence.ts
          --release-tag "$RELEASE_TAG"
          --matrix evaluations/representative-assembly-matrix.json
          --input-dir release-artifacts/representative-rows
          > "release-artifacts/representative-evidence-${RELEASE_TAG#v}.json"

      - name: Upload sanitized representative evidence
        if: ${{ steps.representative_assembly.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: representative-evidence-${{ github.sha }}
          path: release-artifacts/representative-evidence-*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enforce complete representative result
        if: ${{ always() }}
        run: >-
          bun run scripts/release-diagnostics.ts
          --title "Representative repository certification"
          --diagnostics-dir release-artifacts/representative-diagnostics
          --gate "meta=${{ steps.representative_meta.outcome }}"
          --gate "qwen=${{ steps.representative_qwen.outcome }}"
          --gate "openai=${{ steps.representative_openai.outcome }}"

      - name: Upload sanitized representative diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: representative-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/representative-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
