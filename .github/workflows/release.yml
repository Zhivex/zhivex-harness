name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated vX.Y.Z or vX.Y.Z-rc.N tag; must match package.json and resolve to main
        required: true
        type: string
      channel:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      confirm_publication:
        description: I confirm this immutable public npm publication
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate exact tarball
    if: ${{ inputs.confirm_publication && github.repository == 'Zhivex/zhivex-harness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install immutable dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Preload immutable-capable OCI execution image
        run: docker pull node:24-bookworm-slim

      - name: Validate source and release state
        run: |
          bun run release:check
          bun run scripts/check-release-readiness.ts --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL" --registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZHIVEX_HARNESS_OCI_REQUIRED: "1"

      - name: Pack exact release artifact with Bun
        run: |
          mkdir -p release-artifacts
          ARTIFACT="release-artifacts/zhivex-ai-harness-${RELEASE_TAG#v}.tgz"
          bun pm pack --filename "$ARTIFACT" --ignore-scripts
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Inspect exact release artifact
        run: bun run artifact:check -- "$ARTIFACT"

      - name: Install and execute exact release artifact
        run: bun run smoke:artifact -- "$ARTIFACT"

      - name: Upload immutable validated artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/SHA512SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish validated tarball
    needs:
      - validate
      - certify-live
    if: ${{ needs.validate.result == 'success' && needs.certify-live.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}

    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node for npm OIDC transport
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download immutable validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifacts

      - name: Verify transferred artifact bytes
        run: |
          ARTIFACT="release-artifacts/zhivex-ai-harness-${RELEASE_TAG#v}.tgz"
          (cd release-artifacts && shasum -a 512 -c SHA512SUMS)
          bun run artifact:check -- "$ARTIFACT"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Verify npm Trusted Publishing client
        run: >-
          node -e 'const { execFileSync } = require("node:child_process"); const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [major, minor, patch] = version.split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error(`npm ${version} does not support Trusted Publishing; require >=11.5.1`); console.log(`npm ${version} supports Trusted Publishing`);'

      - name: Check immutable registry state
        id: registry
        run: |
          STATUS="$(bun run release:status -- "$ARTIFACT")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Publish exact artifact with provenance
        if: steps.registry.outputs.status == 'absent'
        run: npm publish "./$ARTIFACT" --access public --provenance --tag "$RELEASE_CHANNEL"

      - name: Verify registry integrity and provenance
        run: bun run release:verify -- "$ARTIFACT" "$RELEASE_CHANNEL"

  certify-live:
    name: Certify exact release tag with live providers
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live-certification
    permissions:
      contents: read

    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ZHIVEX_HARNESS_LIVE: "1"
      ZHIVEX_HARNESS_LIVE_PROVIDERS: meta,qwen,openai

    steps:
      - name: Checkout annotated release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install immutable dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify exact annotated release target
        run: bun run scripts/check-release-readiness.ts --tag "$RELEASE_TAG" --channel "${{ inputs.channel }}"

      - name: Preload enforced execution image
        run: docker pull node:24-bookworm-slim

      - name: Certify deterministic OCI boundary
        run: bun run smoke:oci
        env:
          ZHIVEX_HARNESS_OCI_REQUIRED: "1"

      - name: Certify base, orchestration, routing, and model-directed execution
        run: |
          bun run smoke:live
          bun run smoke:live:orchestration
          bun run smoke:live:routing
          bun run smoke:live:execution
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          META_BASE_URL: ${{ secrets.META_BASE_URL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
          QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
          QWEN_REGION: ${{ secrets.QWEN_REGION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
